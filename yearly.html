<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
    <title>Yearly overview — Every Cent Counts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="index.html" aria-label="Every Cent Counts home"><span class="brand-mark">$</span><span>Every Cent Counts</span></a>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html"><span>▦</span>Monthly</a>
          <a class="active" href="yearly.html"><span>◫</span>Yearly</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="profile"><a class="profile-link" href="profile.html?v=6" aria-label="Open profile"><div class="avatar" id="profileAvatar">EC</div><div><strong id="profileName">My profile</strong><small id="profileEmail">Personal account</small></div></a><a class="signout-button" href="signin.html?signout=1">Sign out</a></div>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <button class="mobile-menu" id="menuButton" aria-label="Open navigation">☰</button>
          <div class="period-control">
            <button id="previousYear" aria-label="Previous year">‹</button>
            <button class="month-label" id="yearLabel">2026</button>
            <button id="nextYear" aria-label="Next year">›</button>
          </div>
        </header>

        <section class="content yearly-page">
          <div class="intro"><div><p class="eyebrow">YEARLY OVERVIEW</p><h1>Your year, in<br /><em>one clear view.</em></h1></div><p class="yearly-page-copy">Every month’s income, spending, balance adjustments, and budget progress in one place.</p></div>
          <section class="yearly-page-metrics" id="yearlySummary"></section>
          <section class="panel yearly-panel">
            <div class="panel-heading"><div><p class="section-kicker">MONTH BY MONTH</p><h2 id="yearlyTitle">2026 financial summary</h2></div><span class="yearly-note">SGD</span></div>
            <div class="yearly-table">
              <div class="yearly-head"><span>MONTH</span><span>INCOME</span><span>SPENDING</span><span>NET CHANGE</span><span>BUDGET</span></div>
              <div id="yearlyRows"></div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js?v=2"></script>
    <script src="yearly.js?v=4"></script>
  </body>
</html>
