name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content android/AndroidManifest.xml
          $version = $manifest.manifest.GetAttribute('versionName', 'http://schemas.android.com/apk/res/android')
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match Android versionName: v$version"
          }
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
      - name: Restore private signing credentials
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (!$env:KEYSTORE -or !$env:KEYSTORE_PASSWORD) { throw 'Android signing secrets are missing' }
          New-Item -ItemType Directory -Force android/signing | Out-Null
          [IO.File]::WriteAllBytes("$PWD/android/signing/every-cent-counts.jks", [Convert]::FromBase64String($env:KEYSTORE))
          [IO.File]::WriteAllText("$PWD/android/signing/keystore-password.txt", $env:KEYSTORE_PASSWORD)
      - name: Build and verify signed APK
        shell: pwsh
        run: ./android/build.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = 'dist/Every-Cent-Counts.apk'
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  Every-Cent-Counts.apk`n")
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title "Every Cent Counts $env:GITHUB_REF_NAME" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:GITHUB_REF_NAME $apk dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'APK upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Remove signing files from runner
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE/android/signing/every-cent-counts.jks", "$env:GITHUB_WORKSPACE/android/signing/keystore-password.txt" -Force -ErrorAction SilentlyContinue
