<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10231d" />
    <title>Create account — Every Cent Counts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page" data-mode="signup">
    <main class="signin-card">
      <a class="brand" href="signin.html"><span class="brand-mark">$</span><span>Every Cent Counts</span></a>
      <div class="signin-intro"><p class="eyebrow">YOUR PRIVATE FINANCE TRACKER</p><h1>Create your tracker.</h1><p>Keep your financial data private and synced across your devices.</p></div>
      <form id="authForm">
        <label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com" /></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" /></label>
        <p class="auth-message" id="authMessage" role="status"></p>
        <button class="submit-transaction" type="submit" id="authSubmit">Create account</button>
        <a class="auth-switch" href="signin.html">Already have an account? Sign in</a>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js?v=2"></script>
    <script src="signin.js?v=5"></script>
  </body>
</html>
